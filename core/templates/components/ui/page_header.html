<header class="hui-page-header">
    <div class="hui-page-header__content">
        <span class="hui-page-header__eyebrow">Gestão Helvi</span>
        <h1>{{ titulo }}</h1>
        {% if subtitulo %}<p>{{ subtitulo }}</p>{% endif %}
    </div>
    {% if acao_url and acao_texto %}
        <a href="{{ acao_url }}" class="btn btn-primary hui-page-header__action">
            {% if acao_icone %}<i class="bi {{ acao_icone }}"></i>{% endif %}
            {{ acao_texto }}
        </a>
    {% endif %}
</header>
