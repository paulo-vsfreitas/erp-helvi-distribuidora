<article class="hui-stat-card h-100">
    <div>
        <span class="hui-stat-card__label">{{ titulo }}</span>
        <strong class="hui-stat-card__value">{{ valor }}</strong>
    </div>
    {% if icone %}
        <span class="hui-stat-card__icon hui-stat-card__icon--{{ cor|default:'primary' }}">
            <i class="bi {{ icone }}"></i>
        </span>
    {% endif %}
</article>
