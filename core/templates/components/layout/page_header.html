<header class="hui-page-header">
    <div class="hui-page-header__content">
        <span class="hui-page-header__eyebrow">Gestão Helvi</span>
        <h1>{{ titulo }}</h1>
        {% if subtitulo %}<p>{{ subtitulo }}</p>{% endif %}
    </div>
    {% if botao_url %}
        <a href="{{ botao_url }}" class="btn btn-primary hui-page-header__action">
            {% if botao_icon %}<i class="{{ botao_icon }}"></i>{% endif %}
            {{ botao_texto }}
        </a>
    {% endif %}
</header>
