{% extends "public/base_public.html" %}
{% load static %}

{% block title %}Senha alterada | ERP Helvi{% endblock %}

{% block content %}
<div class="public-auth-page">

    <div class="auth-card">

        <div class="auth-brand">
            <img
                src="{% static 'img/logo.png' %}"
                alt="Helvi"
                class="auth-logo"
            >

            <h1>Senha alterada</h1>

            <p>
                Sua senha foi redefinida com sucesso.
                Você já pode entrar no ERP Helvi.
            </p>
        </div>

        <a href="{% url 'login' %}"
           class="auth-button auth-button-link">
            Entrar no sistema
        </a>

        <footer class="auth-footer">
            <span>ERP Helvi</span>
            <span>© Helvi Distribuidora</span>
        </footer>

    </div>

</div>
{% endblock %}
