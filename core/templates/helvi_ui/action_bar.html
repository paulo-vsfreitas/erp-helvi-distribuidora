<div class="hui-actions hui-actions--sticky">
    {% if cancel_url %}
        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">{{ cancel_label|default:"Cancelar" }}</a>
    {% endif %}
    <button type="submit" class="btn btn-primary">
        {% if submit_icon %}<i class="{{ submit_icon }}"></i>{% endif %}
        {{ submit_label|default:"Salvar" }}
    </button>
</div>
