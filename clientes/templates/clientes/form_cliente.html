{% extends "core/base.html" %}

{% block title %}{{ titulo }} | ERP Helvi{% endblock %}

{% block content %}
<div class="hui-module-page hui-module-page--clientes">
    <header class="page-header hui-page-header">
        <div><h1>{{ titulo }}</h1><p>Preencha os dados cadastrais e comerciais da ótica.</p></div>
        <a href="{% url 'lista_clientes' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
    </header>
    <form method="post" class="hui-form-card">
        {% csrf_token %}
        <div class="hui-form-grid">{{ form.as_p }}</div>
        <div class="hui-form-actions">
            <a href="{% url 'lista_clientes' %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Salvar ótica</button>
        </div>
    </form>
</div>
{% endblock %}
